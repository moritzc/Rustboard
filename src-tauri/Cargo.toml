[package]
name = "rustboard"
version = "1.5.2"
description = "Rustboard - a pen-first infinite whiteboard"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.36"
svg2pdf = "0.13"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
