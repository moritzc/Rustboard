<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- App Icon Drop Shadow -->
    <filter id="board-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#090A0F" flood-opacity="0.35" />
    </filter>

    <!-- Tray Shadow -->
    <filter id="tray-shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <!-- Warm Rust Frame Gradient -->
    <linearGradient id="rust-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4633E" />
      <stop offset="55%" stop-color="#C94A29" />
      <stop offset="100%" stop-color="#9E3316" />
    </linearGradient>

    <!-- Rust Marker Ink Gradient -->
    <linearGradient id="rust-ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9532F" />
      <stop offset="100%" stop-color="#B53818" />
    </linearGradient>

    <!-- Dot Grid Pattern for Whiteboard Surface -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2" fill="#D5CFC2" />
    </pattern>

    <!-- Outer Frame Clip -->
    <clipPath id="outer-clip">
      <rect x="32" y="32" width="448" height="448" rx="96" />
    </clipPath>

    <!-- Inner Whiteboard Clip -->
    <clipPath id="inner-board-clip">
      <rect x="68" y="68" width="376" height="368" rx="64" />
    </clipPath>
  </defs>

  <!-- 1. OUTER RUST FRAME -->
  <g filter="url(#board-shadow)">
    <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#rust-frame)" />

    <!-- Flat-Vector Geometric Shading Panels on Frame -->
    <g clip-path="url(#outer-clip)">
      <polygon points="32,380 140,480 32,480" fill="#8C2B10" opacity="0.55" />
      <polygon points="480,280 480,480 280,480" fill="#8C2B10" opacity="0.45" />
      <polygon points="32,32 240,32 32,220" fill="#F47956" opacity="0.35" />
    </g>

    <!-- Frame Inner Rim Highlight -->
    <rect x="34" y="34" width="444" height="444" rx="94" fill="none" stroke="#F68B6B" stroke-width="2" opacity="0.4" />
  </g>

  <!-- 2. RECESSED WHITEBOARD SURFACE -->
  <!-- Dark Cavity Backing -->
  <rect x="64" y="64" width="384" height="376" rx="68" fill="#7B240C" />

  <!-- Cream Whiteboard Canvas -->
  <g clip-path="url(#inner-board-clip)">
    <rect x="68" y="68" width="376" height="368" rx="64" fill="#FAF7F0" />

    <!-- Subtle Glare Diagonal Sweep -->
    <polygon points="40,440 240,60 330,60 130,440" fill="#FFFFFF" opacity="0.55" />

    <!-- Dot Matrix Grid -->
    <rect x="68" y="68" width="376" height="368" fill="url(#dot-grid)" />

    <!-- Inner Top-Left Recessed Shadow -->
    <path d="M 68 140 C 68 96, 96 68, 140 68 L 372 68 C 416 68, 444 96, 444 140" 
          fill="none" stroke="#E6E0D2" stroke-width="10" />
  </g>

  <!-- 3. WHITEBOARD DRAWINGS (CENTRAL "R" + LOCAL DIAGRAMS) -->
  <!-- Top-Left: Connected Local Graph Node (Dark Slate Marker) -->
  <g stroke="#434A54" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Connection Lines -->
    <line x1="146" y1="152" x2="188" y2="132" stroke-width="4.5" />
    <line x1="142" y1="158" x2="154" y2="196" stroke-width="4.5" />

    <!-- Main Hub Node with Sketch Hatching -->
    <circle cx="136" cy="154" r="14" fill="#FAF7F0" stroke-width="4.5" />
    <line x1="127" y1="150" x2="139" y2="141" stroke-width="3" />
    <line x1="126" y1="158" x2="145" y2="145" stroke-width="3" />
    <line x1="131" y1="163" x2="147" y2="152" stroke-width="3" />

    <!-- Sub-nodes -->
    <circle cx="195" cy="129" r="7.5" fill="#FAF7F0" stroke-width="4" />
    <circle cx="157" cy="204" r="7.5" fill="#FAF7F0" stroke-width="4" />
  </g>

  <!-- Bottom-Left: Rust Cluster & Arrow -->
  <g stroke="#D9532F" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="122" y1="286" x2="135" y2="306" stroke-width="3.5" />
    <line x1="145" y1="316" x2="164" y2="326" stroke-width="3.5" />

    <!-- Rust Node with Hatching -->
    <circle cx="139" cy="312" r="9.5" fill="#FAF7F0" stroke-width="4" />
    <line x1="133" y1="310" x2="141" y2="304" stroke-width="2.5" />
    <line x1="135" y1="317" x2="145" y2="309" stroke-width="2.5" />

    <!-- Small Satellite Nodes -->
    <circle cx="118" cy="280" r="5" fill="#FAF7F0" stroke-width="3.5" />
    <circle cx="170" cy="330" r="6" fill="#FAF7F0" stroke-width="3.5" />

    <!-- Curved Arrow Pointing to R -->
    <path d="M 145 302 Q 162 282, 184 268" stroke-width="4" />
    <polyline points="172,265 186,267 180,280" stroke-width="4" />
  </g>

  <!-- Top-Right: Rust Node & Flow Arrows -->
  <g stroke="#D9532F" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="352" cy="140" r="11.5" fill="#FAF7F0" stroke-width="4" />
    <line x1="345" y1="138" x2="354" y2="131" stroke-width="2.5" />
    <line x1="346" y1="145" x2="359" y2="135" stroke-width="2.5" />
    <line x1="352" y1="149" x2="361" y2="142" stroke-width="2.5" />

    <!-- Curved Arrow Left -->
    <path d="M 332 136 Q 305 134, 288 152" stroke-width="4" />
    <polyline points="287,139 286,154 300,150" stroke-width="4" />
  </g>

  <!-- Right & Bottom-Right: Dark Slate Flow Arrows & Local House Node -->
  <g stroke="#434A54" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Right Downward Curved Arrow -->
    <path d="M 358 164 Q 358 198, 322 216" stroke-width="4" />
    <polyline points="329,204 319,217 335,220" stroke-width="4" />

    <!-- Bottom-Right Upward Curved Arrow -->
    <path d="M 346 286 Q 332 266, 308 256" stroke-width="4" />
    <polyline points="320,251 305,255 314,267" stroke-width="4" />

    <!-- Sketched Local/Home Node (Bottom-Right) -->
    <circle cx="356" cy="300" r="11" fill="#FAF7F0" stroke-width="4" />
    <line x1="349" y1="298" x2="358" y2="291" stroke-width="2.5" />
    <line x1="350" y1="305" x2="363" y2="295" stroke-width="2.5" />
    <line x1="355" y1="309" x2="364" y2="302" stroke-width="2.5" />
  </g>

  <!-- CENTERPIECE: HAND-DRAWN DRY-ERASE MARKER "R" -->
  <g>
    <!-- Primary Thick Chisel Marker Strokes -->
    <g fill="none" stroke="url(#rust-ink)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vertical Stem (Double-pass marker look) -->
      <path d="M 218 168 C 217 220, 218 278, 219 328" stroke-width="22" />
      <path d="M 227 172 C 226 222, 226 276, 228 325" stroke-width="14" />

      <!-- Top Cap & Rounded Bowl of R -->
      <path d="M 204 172 C 238 156, 304 156, 304 202 C 304 242, 256 254, 218 258" stroke-width="22" />

      <!-- Diagonal Kicker Leg -->
      <path d="M 244 252 C 266 276, 288 302, 308 322" stroke-width="22" />
      <path d="M 254 250 C 276 272, 296 296, 315 316" stroke-width="11" />
    </g>

    <!-- Dry-Erase Marker Streak Highlights (Gives authentic hand-drawn feel) -->
    <g fill="none" stroke="#E86F4E" stroke-linecap="round" opacity="0.55">
      <path d="M 215 182 L 216 314" stroke-width="3.5" />
      <path d="M 216 168 C 246 158, 294 162, 296 200 C 297 230, 258 244, 226 250" stroke-width="3.5" />
      <path d="M 256 260 L 304 314" stroke-width="3.5" />
    </g>
  </g>

  <!-- 4. WHITEBOARD ERASER & MARKER ON TRAY -->
  <!-- Eraser (Sitting on Left of Tray) -->
  <g>
    <!-- Rust Handle Top -->
    <rect x="150" y="388" width="76" height="17" rx="5" fill="#D9532F" />
    <path d="M 196 388 L 221 388 C 224 388, 226 390, 226 393 L 226 405 L 196 405 Z" fill="#B53818" />
    <!-- Cream Foam Divider -->
    <rect x="150" y="403" width="76" height="7" fill="#E8E2D5" />
    <!-- Dark Felt Pad -->
    <rect x="150" y="410" width="76" height="12" fill="#9E9A90" />
    <rect x="196" y="410" width="30" height="12" fill="#858178" />
    <!-- Felt Pad Texture Ticks -->
    <g stroke="#6E6A63" stroke-width="2" stroke-linecap="round">
      <line x1="162" y1="415" x2="162" y2="418" />
      <line x1="175" y1="415" x2="175" y2="418" />
      <line x1="188" y1="415" x2="188" y2="418" />
      <line x1="201" y1="415" x2="201" y2="418" />
      <line x1="214" y1="415" x2="214" y2="418" />
    </g>
  </g>

  <!-- Dry-Erase Marker (Sitting on Right of Tray) -->
  <g>
    <!-- Cap Tip -->
    <rect x="252" y="405" width="12" height="11" rx="3" fill="#B53818" />
    <!-- Marker Cap -->
    <rect x="261" y="399" width="30" height="22" rx="4" fill="#D9532F" />
    <rect x="261" y="414" width="30" height="7" rx="2" fill="#B53818" />
    <!-- White Barrel -->
    <rect x="291" y="400" width="74" height="20" rx="3" fill="#FFFFFF" />
    <rect x="291" y="414" width="74" height="6" rx="2" fill="#E6E1D6" />
    <!-- Rust Barrel Label Stripe -->
    <rect x="304" y="405" width="44" height="9" rx="4.5" fill="#D9532F" />
    <!-- Marker End Plug -->
    <rect x="364" y="403" width="8" height="14" rx="2.5" fill="#D9532F" />
  </g>

  <!-- Dark Slate Marker Tray / Ledge -->
  <g filter="url(#tray-shadow)">
    <rect x="122" y="420" width="268" height="24" rx="7" fill="#3B4048" />
    <!-- Top Bevel Highlight -->
    <rect x="122" y="420" width="268" height="6" rx="3" fill="#525864" />
  </g>
</svg>
